name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Download Stockfish for browser
        run: |
          mkdir -p src/ChessAnalyzer.Web/wwwroot/js
          curl -fsSL "https://cdn.jsdelivr.net/npm/stockfish.js@10.0.0/stockfish.js" \
            -o src/ChessAnalyzer.Web/wwwroot/js/stockfish.js
          curl -fsSL "https://cdn.jsdelivr.net/npm/stockfish.js@10.0.0/stockfish.wasm.js" \
            -o src/ChessAnalyzer.Web/wwwroot/js/stockfish.wasm.js

      - name: Publish Blazor WebAssembly
        run: |
          dotnet publish src/ChessAnalyzer.Web/ChessAnalyzer.Web.csproj \
            -c Release \
            -o publish

      - name: Prepare GitHub Pages artifacts
        run: |
          touch publish/wwwroot/.nojekyll
          cp publish/wwwroot/index.html publish/wwwroot/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

      - uses: actions/deploy-pages@v4
        id: deployment
