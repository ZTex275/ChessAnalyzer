name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Pin .NET 9 SDK
        run: |
          cat > global.json <<'EOF'
          {
            "sdk": {
              "version": "9.0.316",
              "rollForward": "latestFeature"
            }
          }
          EOF

      - name: Read app version
        id: app_version
        run: |
          VERSION=$(grep -m1 ApplicationDisplayVersion src/ChessAnalyzer.Maui/ChessAnalyzer.Maui.csproj | sed -E 's/.*>([^<]+)<.*/\1/' | tr -d ' ')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=ChessAnalyzer-${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Install Android SDK
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Stockfish for Android
        run: |
          curl -fsSL "https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-android-armv8.tar" -o /tmp/stockfish.tar
          tar -xf /tmp/stockfish.tar -C /tmp
          cp /tmp/stockfish/stockfish-android-armv8 src/ChessAnalyzer.Maui/engines/stockfish
          chmod +x src/ChessAnalyzer.Maui/engines/stockfish

      - name: Verify signing keystore
        run: |
          test -f android/chessanalyzer.keystore
          keytool -list -v -keystore android/chessanalyzer.keystore -storepass chessanalyzer -alias chessanalyzer | head -20

      - name: Build Release APK
        run: |
          dotnet publish src/ChessAnalyzer.Maui/ChessAnalyzer.Maui.csproj \
            -f net9.0-android \
            -c Release \
            -p:EnableWindowsTargeting=true \
            -p:AndroidPackageFormat=apk \
            -p:AndroidSdkDirectory="$ANDROID_HOME" \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$PWD/android/chessanalyzer.keystore" \
            -p:AndroidSigningKeyAlias=chessanalyzer \
            -p:AndroidSigningStorePass=chessanalyzer \
            -p:AndroidSigningKeyPass=chessanalyzer

      - name: Collect APK
        run: |
          find . -name '*.apk' -type f | sort
          APK=$(find . -path '*/Release/*-Signed.apk' -type f | head -1)
          if [ -z "$APK" ]; then
            echo "Signed APK not found"
            exit 1
          fi
          cp "$APK" "${{ steps.app_version.outputs.apk_name }}"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "${{ steps.app_version.outputs.apk_name }}"
          ls -la "${{ steps.app_version.outputs.apk_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.app_version.outputs.apk_name }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.app_version.outputs.apk_name }}
          generate_release_notes: true
