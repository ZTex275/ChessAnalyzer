name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Pin .NET 9 SDK
        run: |
          cat > global.json <<'EOF'
          {
            "sdk": {
              "version": "9.0.316",
              "rollForward": "latestFeature"
            }
          }
          EOF

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Install Android SDK
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Stockfish for Android
        run: |
          curl -fsSL "https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-android-armv8.tar" -o /tmp/stockfish.tar
          tar -xf /tmp/stockfish.tar -C /tmp
          cp /tmp/stockfish/stockfish-android-armv8 src/ChessAnalyzer.Maui/engines/stockfish
          chmod +x src/ChessAnalyzer.Maui/engines/stockfish

      - name: Create signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore chessanalyzer.keystore \
            -alias chessanalyzer \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=ChessAnalyzer, OU=Mobile, O=ChessAnalyzer, L=Unknown, ST=Unknown, C=US"

      - name: Build Release APK
        run: |
          dotnet publish src/ChessAnalyzer.Maui/ChessAnalyzer.Maui.csproj \
            -f net9.0-android \
            -c Release \
            -p:EnableWindowsTargeting=true \
            -p:AndroidPackageFormat=apk \
            -p:AndroidSdkDirectory="$ANDROID_HOME" \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$PWD/chessanalyzer.keystore" \
            -p:AndroidSigningKeyAlias=chessanalyzer \
            -p:AndroidSigningStorePass=android \
            -p:AndroidSigningKeyPass=android

      - name: Collect APK
        run: |
          find . -name '*.apk' -type f | sort
          APK=$(find . -path '*/Release/*-Signed.apk' -type f | head -1)
          if [ -z "$APK" ]; then
            echo "Signed APK not found"
            exit 1
          fi
          cp "$APK" ChessAnalyzer-1.0.1.apk
          jarsigner -verify ChessAnalyzer-1.0.1.apk
          ls -la ChessAnalyzer-1.0.1.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ChessAnalyzer-1.0.1.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ChessAnalyzer-1.0.1.apk
          generate_release_notes: true
