<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Chess Analyzer</title>
    <base href="/" />
    <link href="_content/ChessAnalyzer.Shared/css/app.css" rel="stylesheet" />
    <style>
        html, body {
            margin: 0;
            background: #1e1e1e;
            color: #f0f0f0;
            font-family: Segoe UI, sans-serif;
        }
        #app { min-height: 100vh; padding: 16px; box-sizing: border-box; }
        .boot-error { color: #ffb4b4; line-height: 1.5; }
    </style>
</head>
<body>
    <div id="app">Загрузка...</div>
    <script src="scripts/blazor.webview.es2019.js" autostart="false"></script>
    <script>
        window.addEventListener('error', function (e) {
            var app = document.getElementById('app');
            if (!app) return;
            app.innerHTML = '<p class="boot-error">Ошибка: ' + (e.message || 'не удалось загрузить интерфейс') + '</p>';
        });
        window.setTimeout(function () {
            var app = document.getElementById('app');
            if (!app || typeof Blazor !== 'undefined') return;
            app.innerHTML = '<p class="boot-error">Не удалось запустить интерфейс. Обновите Android System WebView в Google Play и перезапустите приложение.</p>';
        }, 8000);
    </script>
</body>
</html>
